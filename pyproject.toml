[project]
name = "trusttrace-web"
version = "0.1.0"
description = "TrustTrace Web layer — Oxide Observatory forensic UI (FastAPI + Jinja2 + HTMX)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "pydantic>=2.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
