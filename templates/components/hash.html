{% macro hashrow(value, label='hash') -%}
<div class="hashrow" x-data="{ revealed: false }"
     data-full="{{ value }}" data-short="{{ value[:14] }}…{{ value[-8:] }}">
  <span class="val" x-text="revealed ? $el.closest('.hashrow').dataset.full : $el.closest('.hashrow').dataset.short">{{ value[:14] }}…{{ value[-8:] }}</span>
  <button class="btn ghost icon" type="button" @click="revealed = !revealed" :aria-pressed="revealed.toString()" aria-label="Toggle full {{ label }}">
    <span x-text="revealed ? 'Hide' : 'Reveal'"></span>
  </button>
  <button class="btn ghost icon" type="button" @click="copyText($el.closest('.hashrow').dataset.full, $el)" aria-label="Copy full {{ label }}">Copy</button>
</div>
{%- endmacro %}
